<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección de Contacto</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/styles/contacto.css">

</head>

<body class="d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row g-4 align-items-start container-form">

            <!-- Contacto -->
            <div class="contacto-container">
                <h2 class="contacto-titulo">Contáctanos</h2>

                <div class="contacto-lista">


                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-envelope-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Correo electrónico</span>
                            <a href="mailto:equipo.nodo@correo-ficticio.dev"
                                class="contacto-val">equipo.nodo@correo-ficticio.dev</a>
                        </div>
                    </div>


                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-telephone-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Teléfono</span>
                            <span class="contacto-val">+57 300 123 4567 <small>(extension 123)</small></span>
                        </div>
                    </div>


                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-clock-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Horario de atención</span>
                            <span class="contacto-val">Lunes a viernes, 9:00 a 17:00</span>
                        </div>
                    </div>


                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Ubicación</span>
                            <span class="contacto-val">Medellín, Colombia — proyecto académico TIFC</span>
                        </div>
                    </div>

                </div>
            </div>

            <!--columna form-->

            <div class="form-card-container">
                <h2 class="form-titulo">Tus Datos</h2>

                <form id="formContacto" novalidate>

                    
                    <div class="form-group mb-3">
                        <label for="nombre" class="form-label-custom">Nombre completo</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" id="nombre" class="input-custom" placeholder="Ej. Carlos Pérez" required>
                        </div>
                    </div>

                    
                    <div class="form-group mb-3">
                        <label for="correo" class="form-label-custom">Correo electrónico</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" id="correo" class="input-custom" placeholder="tu@correo.com" required>
                        </div>
                    </div>

                    
                    <div class="form-group mb-4">
                        <label for="mensaje" class="form-label-custom">Mensaje</label>
                        <div class="input-wrapper textarea-wrapper">
                            <i class="bi bi-chat-left-text input-icon textarea-icon"></i>
                            <textarea id="mensaje" class="input-custom textarea-custom" rows="4"
                                placeholder="Desahógate y cuéntanos..." required></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-start">
                        <button type="submit" class="btn-submit">
                            <span>Enviar mensaje</span>
                            <i class="bi bi-send-fill ms-2"></i>
                        </button>
                    </div>
                </form>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
