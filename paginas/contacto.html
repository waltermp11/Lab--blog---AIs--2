<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sección de Contacto</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/styles/contacto.css">

</head>

<body class="d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row g-4 align-items-start container-form">

            <!-- columna L -->
            <div class="contacto-container">
                <h2 class="contacto-titulo">Contáctanos</h2>

                <div class="contacto-lista">

                    
                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-envelope-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Correo electrónico</span>
                            <a href="mailto:equipo.nodo@correo-ficticio.dev"
                                class="contacto-val">equipo.nodo@correo-ficticio.dev</a>
                        </div>
                    </div>

    
                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-telephone-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Teléfono</span>
                            <span class="contacto-val">+57 300 000 0000 <small>(línea de ejemplo)</small></span>
                        </div>
                    </div>

                    
                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-clock-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Horario de atención</span>
                            <span class="contacto-val">Lunes a viernes, 9:00 a 17:00</span>
                        </div>
                    </div>

                    
                    <div class="contacto-card">
                        <div class="contacto-icon">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>
                        <div class="contacto-info">
                            <span class="contacto-label">Ubicación</span>
                            <span class="contacto-val">Medellín, Colombia — proyecto académico TIFC</span>
                        </div>
                    </div>

                </div>
            </div>

            <!--columna R-->

            <div class="col-12 col-md-6">
                <h2 class="text-white fw-bold mb-4">Tus Datos</h2>

                <form id="formContacto" class="formulario-contacto">

                    <div class="row mb-3 align-items-center">
                        <label for="nombre" class="col-sm-3 col-form-label text-white fw-medium">Nombre</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control form-control-custom" id="nombre"
                                placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="correo" class="col-sm-3 col-form-label text-white fw-medium">Correo</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control form-control-custom" id="correo"
                                placeholder="tu@correo.com" required>
                        </div>
                    </div>


                    <div class="row mb-4 align-items-start">
                        <label for="mensaje" class="col-sm-3 col-form-label text-white fw-medium pt-2">Mensaje</label>
                        <div class="col-sm-9">
                            <textarea class="form-control textarea-custom" id="mensaje" rows="5"
                                placeholder="Desahogate y cuentanos" required></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-custom">Enviar mensaje</button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
